<button id="installBtn" class="install-btn" hidden>Ilovani o'rnatish</button>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
(function(){let ev=null;const b=document.getElementById('installBtn');
  try{if(localStorage.getItem('tilmoch-v2')&&JSON.parse(localStorage.getItem('tilmoch-v2')).ui==='ru')b.textContent='Установить приложение';}catch(e){}
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();ev=e;b.hidden=false;});
  b.addEventListener('click',async()=>{if(!ev)return;b.hidden=true;ev.prompt();try{await ev.userChoice;}catch(e){}ev=null;});
  window.addEventListener('appinstalled',()=>{b.hidden=true;});})();
</script>
